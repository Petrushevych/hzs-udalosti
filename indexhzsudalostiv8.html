<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script>
// 🔥 Firebase konfigurace
const firebaseConfig = {
  apiKey: "AIzaSyAf1s7JPna788ymY3ZmnQj6yEIM3H201cQ",
  authDomain: "udalosti-hzs-fivepd.firebaseapp.com",
  databaseURL: "https://udalosti-hzs-fivepd-default-rtdb.firebaseio.com",
  projectId: "udalosti-hzs-fivepd",
  storageBucket: "udalosti-hzs-fivepd.appspot.com",
  messagingSenderId: "1032416028363",
  appId: "1:1032416028363:web:f150ad103ea19b9f7e9d4e"
};

firebase.initializeApp(firebaseConfig);

// 📡 Komunikační kanál
const kanal = new BroadcastChannel("udalosti-kanal");
const mojeId = Math.random().toString(36).substr(2, 9);

// 🗣️ Aktivace hlasového enginu
window.speechSynthesis.onvoiceschanged = () => {
  window.availableVoices = speechSynthesis.getVoices();
};

// 🔊 Funkce pro přehrání sekvence siréna → hlas → siréna
function prehratSekvenci(text) {
  const zvuk = document.getElementById("zvuk-udalosti");
  if (!zvuk) return;

  zvuk.muted = false;
  zvuk.currentTime = 0;

  // 🧠 Nastavíme onended pokaždé
  zvuk.onended = () => {
    zvuk.onended = null;

    const hlaseni = new SpeechSynthesisUtterance(text);
    hlaseni.lang = "cs-CZ";
    hlaseni.rate = 0.85;
    hlaseni.pitch = 1;
    hlaseni.volume = 1;

    const ceskyHlas = (window.availableVoices || []).find(h => h.lang === "cs-CZ");
    if (ceskyHlas) hlaseni.voice = ceskyHlas;

    hlaseni.onend = () => {
      setTimeout(() => {
        zvuk.currentTime = 0;
        zvuk.play();
      }, 100); // malá prodleva pro jistotu
    };

    speechSynthesis.speak(hlaseni);
  };

  // 🔊 Spustíme první sirénu
  zvuk.play();
}


// 📥 Posluchač pro příchozí hlášení
kanal.onmessage = (event) => {
  if (event.data.typ === "hlaseni" && event.data.odesilatel !== mojeId) {
    prehratSekvenci(event.data.text);
  }
};



  const map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: -2,
    maxZoom: 4
  });

  // ... další kód
  
  const bounds = [[0,0], [1024,1024]];
  const image = L.imageOverlay('mapa.png', bounds).addTo(map);
  map.fitBounds(bounds);

  const ikony = {
    "P": L.icon({ iconUrl: 'pozar.png', iconSize: [32, 32], iconAnchor: [32, 32], popupAnchor: [0, -32] }),
    "DN": L.icon({ iconUrl: 'nehoda.png', iconSize: [32, 32], iconAnchor: [32, 32], popupAnchor: [0, -32] }),
    "TP": L.icon({ iconUrl: 'technika.png', iconSize: [32, 32], iconAnchor: [32, 32], popupAnchor: [0, -32] }),
    "ZOZ": L.icon({ iconUrl: 'zachrana.png', iconSize: [32, 32], iconAnchor: [32, 32], popupAnchor: [0, -32] }),
    "UNL": L.icon({ iconUrl: 'unik.png', iconSize: [32, 32], iconAnchor: [32, 32], popupAnchor: [0, -32] }),
    "POP": L.icon({ iconUrl: 'poplach.png', iconSize: [32, 32], iconAnchor: [32, 32], popupAnchor: [0, -32] }),
    "OST": L.icon({ iconUrl: 'ostatní.png', iconSize: [32, 32], iconAnchor: [32, 32], popupAnchor: [0, -32] }),
  };
  
const uliceSeznam = [
  "Masarykova", "Dlouhá", "Komenského", "Husova", "Školní",
  "Nádražní", "Jiráskova", "Palackého", "Smetanova", "Tyršova",
  "Na Výsluní", "Pod Páteří", "U Lesa", "Kpt. Jaroše", "U Hřiště", "Zahradní", "Cimrmanova", "Slunečná", "Politická",
];

const mestaSeznam = [
    "Ústí nad Labem", "Praha", "Klášterec nad Ohří", "Teplice", "Děčín", "Litoměřice", "Most",
    "Chomutov", "Louny", "Roudnice nad Labem", "Bílina", "Žatec", "Praha 2", "Praha 3", "Praha 4", "Brno", "Ostrava"
];

  let kliknuteLatLng = null;
const aktivniMarkery = {}; // ← Uchovává markery podle jejich Firebase klíče

map.on('click', function(e) {
  kliknuteLatLng = e.latlng;

  const box = document.getElementById("pozice-box");
  box.innerText = "📍 Vybraná pozice: " + kliknuteLatLng.lat.toFixed(2) + ", " + kliknuteLatLng.lng.toFixed(2);
  box.style.display = "block";

  setTimeout(() => {
    box.style.display = "none";
  }, 3000);
});


function smazatUdalost(klic) {
  // 🧹 Odstranění markeru z mapy
  if (aktivniMarkery[klic]) {
    map.removeLayer(aktivniMarkery[klic]);
    delete aktivniMarkery[klic];
  }

  // 🔥 Smazání z Firebase
  firebase.database().ref("udalosti/" + klic).remove().then(() => {
    const firebaseBox = document.getElementById("firebase-box");
    firebaseBox.innerText = "🗑️ Událost byla úspěšně smazána!";
    firebaseBox.style.background = "rgba(200,0,0,0.85)";
    firebaseBox.style.display = "block";

    setTimeout(() => {
      firebaseBox.style.display = "none";
      firebaseBox.style.background = "rgba(0,128,0,0.85)";
    }, 3000);

    // 🔁 Obnova tabulky bez reloadu
    firebase.database().ref("udalosti").once("value").then(snapshot => {
      const data = snapshot.val();
      const keys = Object.keys(data || {}).reverse();
      const udalosti = Object.values(data || {}).reverse();
      zobrazTabulku(udalosti, keys);
    });
  });
}



function zobrazPoznamku(text) {
  console.log("📝 Zobrazuji poznámku:", text); // Debug
  document.getElementById("poznamka-text").innerText = text;
  document.getElementById("poznamka-modal").style.display = "flex";
}

function zavritPoznamku() {
  document.getElementById("poznamka-modal").style.display = "none";
}

window.speechSynthesis.onvoiceschanged = () => {
  window.availableVoices = speechSynthesis.getVoices();
};

function pridatUdalost() {
  const nazev = document.getElementById('nazev').value;
  const typ = document.getElementById('typ').value;
  const podtyp = document.getElementById("podtyp").value;
  const rozsah = document.getElementById("rozsah").value;
  const stav = document.getElementById('stav').value;
  const poznamka = document.getElementById('poznamka').value;
  const ulice = document.getElementById("ulice").value;
  const mesto = document.getElementById("mesto").value;

  const jednotky = [];
  if (document.getElementById('pcr').checked) jednotky.push("PČR");
  if (document.getElementById('zzs').checked) jednotky.push("ZZS");
  if (document.getElementById('vea').checked) jednotky.push("VEA");
  if (document.getElementById('ta').checked) jednotky.push("TA");
  if (document.getElementById('da').checked) jednotky.push("DA");
  if (document.getElementById('t815').checked) jednotky.push("HSA 241");
  if (document.getElementById('t148').checked) jednotky.push("HSA 242");
  if (document.getElementById('cas20').checked) jednotky.push("PSA 101");
  if (document.getElementById('cas30').checked) jednotky.push("PSA 102");
  if (document.getElementById('az30').checked) jednotky.push("PSA 103");
  if (document.getElementById('rza').checked) jednotky.push("PSA 106");
  if (document.getElementById('cas202').checked) jednotky.push("PSA 107");
  if (document.getElementById('cas15').checked) jednotky.push("PSA 117");
  if (document.getElementById('vya').checked) jednotky.push("VYA");

  if (jednotky.length === 0) {
    const firebaseBox = document.getElementById("firebase-box");
    firebaseBox.innerText = "⛔ Musíš vybrat alespoň jednu jednotku (HZS, JSDH, PČR, ZZS)";
    firebaseBox.style.background = "rgba(200,0,0,0.85)";
    firebaseBox.style.display = "block";
    setTimeout(() => {
      firebaseBox.style.display = "none";
      firebaseBox.style.background = "rgba(0,128,0,0.85)";
    }, 3000);
    return;
  }

  if (!kliknuteLatLng) {
    const firebaseBox = document.getElementById("firebase-box");
    firebaseBox.innerText = "⛔ Musíš nejdřív kliknout na mapu!";
    firebaseBox.style.background = "rgba(200,0,0,0.85)";
    firebaseBox.style.display = "block";
    setTimeout(() => {
      firebaseBox.style.display = "none";
      firebaseBox.style.background = "rgba(0,128,0,0.85)";
    }, 3000);
    return;
  }

  const typText = {
    "P": "Požár",
    "DN": "Dopravní nehoda",
    "TP": "Technická pomoc",
    "ZOZ": "Záchrana osob a zvířat",
    "UNL": "Únik nebezpečných látek",
    "POP": "Poplach",
    "OST": "Ostatní událost"
  };

const jednotkyVyslov = jednotky.map(j => {
  if (j === "VEA") return "Velitelský Automobil";
  if (j === "TA") return "Technický Automobil";
  if (j === "DA") return "Dopravní Automobil";
  if (j === "VYA") return "Vyprošťovací Automobil";
  if (j === "PSA 101") return "P S A STO JEDNA";
  if (j === "PSA 102") return "P S A STO DVA";
  if (j === "PSA 103") return "P S A STO TŘI";
  if (j === "PSA 106") return "P S A STO ŠEST";
  if (j === "PSA 107") return "P S A STO SEDM";
  if (j === "PSA 117") return "P S A STO SEDMNÁCT";
  if (j === "HSA 241") return "HÁESÁ  DVĚSTĚ ČTYŘICET JEDNA";
  if (j === "HSA 242") return "HÁESÁ  DVĚSTĚ ČTYŘICET DVA";
  return j; // ostatní nech tak, jak jsou
});

  const hlaseniText = `Pozor poplach! Nová událost. ${typText[typ] || nazev} Ulice ${ulice} ${mesto}. ${typText[typ] || nazev} ${poznamka || "bez poznámky"}. Vyjede: ${jednotkyVyslov.join(", ")}.`;

const typyProPoplach = ["P", "DN", "TP", "ZOZ", "UNL", "POP", "OST"]; // můžeš přidat další podle potřeby

if (typyProPoplach.includes(typ)) {
  console.log("📡 Pokus o zápis do poplach pro typ:", typ);
  firebase.database().ref("poplach").set({
    cas: Date.now(),
    text: hlaseniText,
    odesilatel: mojeId
  })
  .then(() => {
    console.log("✅ Poplach zapsán!");
  })
  .catch(err => {
    console.error("❌ Chyba při zápisu do poplach:", err);
  });

  setTimeout(() => {
    firebase.database().ref("poplach").remove();
  }, 5000);
}


  kanal.postMessage({
    typ: "hlaseni",
    text: hlaseniText,
    odesilatel: mojeId
  });

prehratSekvenci(hlaseniText);


  const casVyhlaseni = new Date().toLocaleString("cs-CZ", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit",

  });

  const marker = L.marker([kliknuteLatLng.lat, kliknuteLatLng.lng], {
    icon: ikony[typ]
  }).addTo(map);

  marker.bindPopup(
    `<div style="font-size:1.3em; font-weight:bold; margin-bottom:5px;">${nazev}</div>
     <div><strong>Čas:</strong> ${casVyhlaseni}</div>
     <div><strong>Adresa:</strong> ${ulice}, ${mesto}</div>
     <div><strong>Jednotky:</strong> ${jednotky.join(", ")}</div>
     <div><i>${poznamka}</i></div>`
  ).openPopup();

  firebase.database().ref("udalosti").push({
    casVyhlaseni,
    nazev,
    typ,
    podtyp,
    rozsah,
    ulice,
    mesto,
    stav,
    poznamka,
    jednotky: jednotky.join(", "),
    lat: kliknuteLatLng.lat,
    lng: kliknuteLatLng.lng
  }).then(() => {
    const firebaseBox = document.getElementById("firebase-box");
    firebaseBox.innerText = "✅ Událost byla úspěšně přidána!";
    firebaseBox.style.display = "block";
    setTimeout(() => {
      firebaseBox.style.display = "none";
    }, 3000);

    firebase.database().ref("udalosti").once("value").then(snapshot => {
      const data = snapshot.val();
      const keys = Object.keys(data || {}).reverse();
      const udalosti = Object.values(data || {}).reverse();
      zobrazTabulku(udalosti, keys);
    });
  });
}

function aktualizujJednotkyCheckbox(jednotka, index, checked) {
  if (!prihlaseny) return;

  firebase.database().ref("udalosti").once("value").then(snapshot => {
    const data = snapshot.val();
    const keys = Object.keys(data || {}).reverse();
    const key = keys[index];
    const aktualni = data[key].jednotky?.split(",").map(j => j.trim()) || [];

    let noveJednotky;
    if (checked) {
      // Přidat jednotku
      if (!aktualni.includes(jednotka)) aktualni.push(jednotka);
    } else {
      // Odebrat jednotku
      noveJednotky = aktualni.filter(j => j !== jednotka);
    }

    firebase.database().ref("udalosti/" + key).update({
      jednotky: (noveJednotky || aktualni).join(", ")
    });
  });
}

  });
}
